[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "barcodeGen"
version = "8.13.1"
description = "Desktop GUI application for generating barcode and QR-code labels as printable PDFs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "customtkinter>=5.2.0",
    "python-barcode>=0.15.1",
    "Pillow>=8.0.0",
    "reportlab>=3.6.0",
    "qrcode>=7.0.0",
    "openpyxl>=3.0.0",
    "tkinterdnd2",
    "pyzbar>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=5.0.0",
    "pytest>=7.0.0",
]

[project.scripts]
barcode-gen = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
