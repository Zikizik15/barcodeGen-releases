# Автотесты: запускаются при каждом push и pull request.
# Результат виден на GitHub зелёной галочкой или красным крестиком
# рядом с коммитом (вкладка Actions — подробный лог).

name: Тесты

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 — минимальная поддерживаемая (pyproject.toml), 3.12 — свежая
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Тесты
        run: python -m pytest -v
